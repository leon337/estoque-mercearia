name: M7 PRF Manifest
on:
  push:
    branches: [feature/m7-mvp-qualification]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/m7-mvp-qualification }
      - name: Generate SHA-256 manifest
        run: |
          cd artifacts/phases/PHASE-06-M7-MVP-QUALIFICATION
          sha256sum PHASE-06-M7-PLAN.md MISSION-TRACE.md PHASE-06-M7-REPORT.md PHASE-06-M7-VALIDATION.txt PHASE-06-M7-VALIDATION-FULL.txt PHASE-06-M7-SMOKE.txt PHASE-06-M7-CHECKPOINT.yaml PHASE-06-M7-DECISIONS.md README.md > PHASE-06-M7-ARTIFACT-MANIFEST.sha256
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phases/PHASE-06-M7-MVP-QUALIFICATION/PHASE-06-M7-ARTIFACT-MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m "docs(mcf): generate M7 PRF manifest"
          git push origin HEAD:feature/m7-mvp-qualification