name: M5 PRF Manifest
on:
  push:
    branches: [feature/m5-history-dashboard]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/m5-history-dashboard }
      - name: Generate SHA-256 manifest
        run: |
          cd artifacts/phases/PHASE-06-M5-HISTORICO-DASHBOARD
          sha256sum PHASE-06-M5-PLAN.md MISSION-TRACE.md PHASE-06-M5-REPORT.md PHASE-06-M5-VALIDATION.txt PHASE-06-M5-VALIDATION-FULL.txt PHASE-06-M5-SMOKE.txt PHASE-06-M5-CHECKPOINT.yaml PHASE-06-M5-DECISIONS.md README.md > PHASE-06-M5-ARTIFACT-MANIFEST.sha256
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phases/PHASE-06-M5-HISTORICO-DASHBOARD/PHASE-06-M5-ARTIFACT-MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m "docs(mcf): generate M5 PRF manifest"
          git push origin HEAD:feature/m5-history-dashboard