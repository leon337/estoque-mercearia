name: M2 Products Smoke

on:
  push:
    branches:
      - feature/m2-products

permissions:
  contents: read

jobs:
  products-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase environment
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          LOCAL_URL="${API_URL:-http://127.0.0.1:54321}"
          LOCAL_PUBLISHABLE="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          LOCAL_SECRET="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$LOCAL_PUBLISHABLE"
          test -n "$LOCAL_SECRET"
          echo "NEXT_PUBLIC_SUPABASE_URL=$LOCAL_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$LOCAL_PUBLISHABLE" >> "$GITHUB_ENV"
          echo "LOCAL_SERVICE_KEY=$LOCAL_SECRET" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=m2-admin-${GITHUB_RUN_ID}@test.local" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=M2-Admin-${GITHUB_RUN_ID}!Aa9" >> "$GITHUB_ENV"
          echo "OPERATOR_EMAIL=m2-operator-${GITHUB_RUN_ID}@test.local" >> "$GITHUB_ENV"
          echo "OPERATOR_PASSWORD=M2-Operator-${GITHUB_RUN_ID}!Aa9" >> "$GITHUB_ENV"

      - name: Create local ADMIN and OPERATOR
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'

          const admin = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.LOCAL_SERVICE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          )

          async function createUser(email, password, name) {
            const { data, error } = await admin.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
              user_metadata: { name },
            })
            if (error || !data.user) throw error ?? new Error(`user creation failed: ${email}`)
            return data.user.id
          }

          const adminId = await createUser(process.env.ADMIN_EMAIL, process.env.ADMIN_PASSWORD, 'M2 Admin Smoke')
          const operatorId = await createUser(process.env.OPERATOR_EMAIL, process.env.OPERATOR_PASSWORD, 'M2 Operator Smoke')

          const { error: promoteError } = await admin
            .from('profiles')
            .update({ role: 'ADMIN' })
            .eq('id', adminId)
          if (promoteError) throw promoteError

          const { data: profiles, error: profileError } = await admin
            .from('profiles')
            .select('id, name, role, active')
            .in('id', [adminId, operatorId])
          if (profileError) throw profileError
          if (profiles?.length !== 2) throw new Error('profiles were not created by auth trigger')
          if (!profiles.some((p) => p.id === adminId && p.role === 'ADMIN' && p.active)) throw new Error('ADMIN profile invalid')
          if (!profiles.some((p) => p.id === operatorId && p.role === 'OPERATOR' && p.active)) throw new Error('OPERATOR profile invalid')

          console.log('Local auth fixtures ready')
          NODE

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next.log
          exit 45

      - name: Login as ADMIN through Next.js
        run: |
          curl -sS -c /tmp/admin-cookies.txt http://127.0.0.1:3000/login -o /tmp/login.html
          ACTION_FIELD=$(grep -o '\$ACTION_ID_[^" ]*' /tmp/login.html | head -n 1)
          test -n "$ACTION_FIELD"
          curl -sS -D /tmp/login.headers -o /tmp/login.response \
            -c /tmp/admin-cookies.txt -b /tmp/admin-cookies.txt \
            -F "$ACTION_FIELD=" -F "email=$ADMIN_EMAIL" -F "password=$ADMIN_PASSWORD" \
            http://127.0.0.1:3000/login >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/login.headers | tail -n 1)
          echo "login_location=$LOCATION"
          [ "$LOCATION" = "/" ]
          curl -fsS -L -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt http://127.0.0.1:3000/ -o /tmp/home.html
          grep -q 'M2 Admin Smoke' /tmp/home.html
          grep -q 'ADMIN' /tmp/home.html
          grep -q 'Produtos' /tmp/home.html

      - name: Create category through Server Action
        run: |
          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt http://127.0.0.1:3000/products -o /tmp/products.html
          ACTION_FIELD=$(python3 - <<'PY'
          import re
          html=open('/tmp/products.html').read()
          for form in re.findall(r'<form[^>]*>(.*?)</form>', html, re.S):
              if 'name="category_name"' in form:
                  m=re.search(r'name="(\$ACTION_ID_[^"]+)"', form)
                  if m:
                      print(m.group(1)); break
          PY
          )
          test -n "$ACTION_FIELD"
          curl -sS -D /tmp/category.headers -o /tmp/category.response \
            -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            -F "$ACTION_FIELD=" -F 'category_name=M2 Smoke Category' \
            http://127.0.0.1:3000/products >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/category.headers | tail -n 1)
          echo "category_location=$LOCATION"
          [[ "$LOCATION" == *"success=category_created"* ]]

      - name: Create product through Server Action
        run: |
          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt http://127.0.0.1:3000/products/new -o /tmp/new.html
          CATEGORY_ID=$(python3 - <<'PY'
          import re
          html=open('/tmp/new.html').read()
          m=re.search(r'<option value="([^"]+)">M2 Smoke Category</option>', html)
          print(m.group(1) if m else '')
          PY
          )
          ACTION_FIELD=$(python3 - <<'PY'
          import re
          html=open('/tmp/new.html').read()
          for form in re.findall(r'<form[^>]*>(.*?)</form>', html, re.S):
              if 'name="internal_code"' in form:
                  m=re.search(r'name="(\$ACTION_ID_[^"]+)"', form)
                  if m:
                      print(m.group(1)); break
          PY
          )
          test -n "$CATEGORY_ID"
          test -n "$ACTION_FIELD"
          echo "CATEGORY_ID=$CATEGORY_ID" >> "$GITHUB_ENV"
          curl -sS -D /tmp/create.headers -o /tmp/create.response \
            -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            -F "$ACTION_FIELD=" \
            -F 'internal_code=M2-SMOKE-001' \
            -F 'barcode=' \
            -F 'name=M2 Café Smoke' \
            -F "category_id=$CATEGORY_ID" \
            -F 'unit=un' \
            -F 'minimum_stock=7' \
            http://127.0.0.1:3000/products/new >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/create.headers | tail -n 1)
          echo "create_location=$LOCATION"
          [[ "$LOCATION" == *"success=created"* ]]

      - name: Search and edit product as ADMIN
        run: |
          curl -fsS -G -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            --data-urlencode 'q=M2-SMOKE-001' http://127.0.0.1:3000/products -o /tmp/search.html
          grep -q 'M2 Café Smoke' /tmp/search.html
          grep -q 'M2 Smoke Category' /tmp/search.html
          grep -q '7' /tmp/search.html
          EDIT_PATH=$(grep -o '/products/[0-9a-f-]\+/edit' /tmp/search.html | head -n 1)
          test -n "$EDIT_PATH"
          echo "EDIT_PATH=$EDIT_PATH" >> "$GITHUB_ENV"
          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt "http://127.0.0.1:3000$EDIT_PATH" -o /tmp/edit.html
          ACTION_FIELD=$(python3 - <<'PY'
          import re
          html=open('/tmp/edit.html').read()
          for form in re.findall(r'<form[^>]*>(.*?)</form>', html, re.S):
              if 'name="internal_code"' in form:
                  m=re.search(r'name="(\$ACTION_ID_[^"]+)"', form)
                  if m:
                      print(m.group(1)); break
          PY
          )
          PRODUCT_ID=$(basename "$(dirname "$EDIT_PATH")")
          test -n "$ACTION_FIELD"
          curl -sS -D /tmp/update.headers -o /tmp/update.response \
            -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            -F "$ACTION_FIELD=" -F "id=$PRODUCT_ID" \
            -F 'internal_code=M2-SMOKE-001' -F 'barcode=' \
            -F 'name=M2 Café Smoke Atualizado' -F "category_id=$CATEGORY_ID" \
            -F 'unit=UN' -F 'minimum_stock=9' \
            "http://127.0.0.1:3000$EDIT_PATH" >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/update.headers | tail -n 1)
          [[ "$LOCATION" == *"success=updated"* ]]
          echo "PRODUCT_ID=$PRODUCT_ID" >> "$GITHUB_ENV"

      - name: Block category deactivation while active product uses it
        run: |
          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt http://127.0.0.1:3000/products -o /tmp/products2.html
          ACTION_FIELD=$(python3 - <<'PY'
          import os,re
          html=open('/tmp/products2.html').read()
          cid=os.environ['CATEGORY_ID']
          for form in re.findall(r'<form[^>]*>(.*?)</form>', html, re.S):
              if f'name="id" type="hidden" value="{cid}"' in form and 'name="next_active"' in form:
                  m=re.search(r'name="(\$ACTION_ID_[^"]+)"', form)
                  if m:
                      print(m.group(1)); break
          PY
          )
          test -n "$ACTION_FIELD"
          curl -sS -D /tmp/category-block.headers -o /tmp/category-block.response \
            -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            -F "$ACTION_FIELD=" -F "id=$CATEGORY_ID" -F 'next_active=false' \
            http://127.0.0.1:3000/products >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/category-block.headers | tail -n 1)
          echo "category_block_location=$LOCATION"
          [[ "$LOCATION" == *"error=category_in_use"* ]]

      - name: OPERATOR can read active product but cannot open write page
        run: |
          curl -sS -c /tmp/operator-cookies.txt http://127.0.0.1:3000/login -o /tmp/operator-login.html
          ACTION_FIELD=$(grep -o '\$ACTION_ID_[^" ]*' /tmp/operator-login.html | head -n 1)
          test -n "$ACTION_FIELD"
          curl -sS -D /tmp/operator-login.headers -o /tmp/operator-login.response \
            -c /tmp/operator-cookies.txt -b /tmp/operator-cookies.txt \
            -F "$ACTION_FIELD=" -F "email=$OPERATOR_EMAIL" -F "password=$OPERATOR_PASSWORD" \
            http://127.0.0.1:3000/login >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/operator-login.headers | tail -n 1)
          [ "$LOCATION" = "/" ]
          curl -fsS -G -b /tmp/operator-cookies.txt -c /tmp/operator-cookies.txt \
            --data-urlencode 'q=M2-SMOKE-001' http://127.0.0.1:3000/products -o /tmp/operator-products.html
          grep -q 'M2 Café Smoke Atualizado' /tmp/operator-products.html
          if grep -q 'Novo produto' /tmp/operator-products.html; then
            echo 'OPERATOR should not see create action'
            exit 61
          fi
          FINAL_URL=$(curl -sS -L -b /tmp/operator-cookies.txt -c /tmp/operator-cookies.txt \
            -o /tmp/operator-new.html -w '%{url_effective}' http://127.0.0.1:3000/products/new)
          echo "operator_new_url=$FINAL_URL"
          [[ "$FINAL_URL" == *"/products?error=permission"* ]]

      - name: Inactivate product as ADMIN and hide it from OPERATOR
        run: |
          curl -fsS -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt "http://127.0.0.1:3000$EDIT_PATH" -o /tmp/edit2.html
          ACTION_FIELD=$(python3 - <<'PY'
          import re
          html=open('/tmp/edit2.html').read()
          for form in re.findall(r'<form[^>]*>(.*?)</form>', html, re.S):
              if 'name="next_active"' in form and 'name="id"' in form:
                  m=re.search(r'name="(\$ACTION_ID_[^"]+)"', form)
                  if m:
                      print(m.group(1)); break
          PY
          )
          test -n "$ACTION_FIELD"
          curl -sS -D /tmp/toggle.headers -o /tmp/toggle.response \
            -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            -F "$ACTION_FIELD=" -F "id=$PRODUCT_ID" -F 'next_active=false' \
            "http://127.0.0.1:3000$EDIT_PATH" >/dev/null
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/toggle.headers | tail -n 1)
          [[ "$LOCATION" == *"success=deactivated"* ]]
          curl -fsS -G -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            --data-urlencode 'q=M2-SMOKE-001' --data-urlencode 'status=inactive' \
            http://127.0.0.1:3000/products -o /tmp/inactive.html
          grep -q 'M2 Café Smoke Atualizado' /tmp/inactive.html
          grep -q 'Inativo' /tmp/inactive.html
          grep -q '9' /tmp/inactive.html
          curl -fsS -G -b /tmp/operator-cookies.txt -c /tmp/operator-cookies.txt \
            --data-urlencode 'q=M2-SMOKE-001' --data-urlencode 'status=all' \
            http://127.0.0.1:3000/products -o /tmp/operator-after-inactive.html
          if grep -q 'M2 Café Smoke Atualizado' /tmp/operator-after-inactive.html; then
            echo 'OPERATOR saw inactive product'
            exit 62
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/next.log || true
