name: M1 Next.js Auth Smoke

on:
  push:
    branches:
      - feature/m1-auth-base

permissions:
  contents: read

jobs:
  nextjs-auth-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exwtngpwqgkrkoszpgib.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dXdPZQclAr5u7yskNNmHhw_AhtmW81_
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Define temporary credentials
        run: |
          echo "SMOKE_EMAIL=m1-nextjs-${GITHUB_RUN_ID}@gmail.com" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=M1-Next-${GITHUB_RUN_ID}!Aa9" >> "$GITHUB_ENV"

      - name: Ensure temporary operator exists
        run: |
          RESPONSE=$(curl -sS \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\",\"data\":{\"name\":\"M1 Next Smoke\"}}")
          ERROR=$(jq -r '.error_description // .msg // .message // empty' <<< "$RESPONSE")
          if [ -n "$ERROR" ] && [[ "$ERROR" != *"already"* ]]; then
            echo "SIGNUP_ERROR=$ERROR"
            exit 51
          fi
          echo "Signup available for $SMOKE_EMAIL"

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/next.log
          exit 52

      - name: Login through Next.js Server Action
        run: |
          curl -sS -c /tmp/cookies.txt http://127.0.0.1:3000/login -o /tmp/login.html
          ACTION_FIELD=$(grep -o '\$ACTION_ID_[^" ]*' /tmp/login.html | head -n 1)
          if [ -z "$ACTION_FIELD" ]; then
            echo "SERVER_ACTION_FIELD_NOT_FOUND"
            head -c 2000 /tmp/login.html
            exit 53
          fi
          STATUS=$(curl -sS \
            -D /tmp/login.headers \
            -o /tmp/login.response \
            -c /tmp/cookies.txt \
            -b /tmp/cookies.txt \
            -w '%{http_code}' \
            -F "$ACTION_FIELD=" \
            -F "email=$SMOKE_EMAIL" \
            -F "password=$SMOKE_PASSWORD" \
            http://127.0.0.1:3000/login)
          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' /tmp/login.headers | tail -n 1)
          echo "login_http=$STATUS location=$LOCATION"
          if [[ "$LOCATION" == *"error="* ]] || [ -z "$LOCATION" ]; then
            echo "NEXT_LOGIN_FAILED"
            cat /tmp/login.response
            exit 54
          fi

      - name: Verify protected home with session cookie
        run: |
          FINAL_URL=$(curl -sS -L -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -o /tmp/home.html -w '%{url_effective}' http://127.0.0.1:3000/)
          echo "home_url=$FINAL_URL"
          grep -q 'M1 · Auth + Banco Base' /tmp/home.html
          grep -q 'M1 Next Smoke' /tmp/home.html
          grep -q 'OPERATOR' /tmp/home.html
          if [[ "$FINAL_URL" == *"/login"* ]]; then
            echo "SESSION_COOKIE_NOT_ACCEPTED"
            exit 55
          fi
          echo "Protected page accepted authenticated session"

      - name: Logout through Next.js Server Action
        run: |
          ACTION_FIELD=$(grep -o '\$ACTION_ID_[^" ]*' /tmp/home.html | head -n 1)
          if [ -z "$ACTION_FIELD" ]; then
            echo "LOGOUT_ACTION_FIELD_NOT_FOUND"
            exit 56
          fi
          curl -sS \
            -D /tmp/logout.headers \
            -o /tmp/logout.response \
            -c /tmp/cookies.txt \
            -b /tmp/cookies.txt \
            -F "$ACTION_FIELD=" \
            http://127.0.0.1:3000/ >/dev/null
          FINAL_URL=$(curl -sS -L -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -o /tmp/after-logout.html -w '%{url_effective}' http://127.0.0.1:3000/)
          echo "after_logout_url=$FINAL_URL"
          if [[ "$FINAL_URL" != *"/login"* ]]; then
            echo "LOGOUT_DID_NOT_CLEAR_SESSION"
            exit 57
          fi
          grep -q 'Entrar' /tmp/after-logout.html
          echo "Logout cleared authenticated session"

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/next.log || true
