name: M3 Hosted Concurrency Smoke

on:
  push:
    branches:
      - feature/m3-inventory-core

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run hosted concurrency and idempotency smoke
        env:
          SUPABASE_URL: https://exwtngpwqgkrkoszpgib.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_dXdPZQclAr5u7yskNNmHhw_AhtmW81_
          TEST_EMAIL: m3-concurrency-operator-20260817@gmail.com
          TEST_PASSWORD: M3-Concurrency-Operator!Aa9
          PRODUCT_ID: 77777777-7777-4777-8777-777777777777
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto'
          import { createClient } from '@supabase/supabase-js'

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_PUBLISHABLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          )

          const { error: loginError } = await supabase.auth.signInWithPassword({
            email: process.env.TEST_EMAIL,
            password: process.env.TEST_PASSWORD,
          })
          if (loginError) throw new Error(`LOGIN_FAILED: ${loginError.message}`)

          async function balance() {
            const { data, error } = await supabase
              .from('inventory')
              .select('quantity')
              .eq('product_id', process.env.PRODUCT_ID)
              .single()
            if (error) throw new Error(`BALANCE_READ_FAILED: ${error.message}`)
            return Number(data.quantity)
          }

          async function movement(params) {
            return supabase.rpc('register_stock_movement', {
              p_product_id: process.env.PRODUCT_ID,
              p_type: params.type,
              p_quantity: params.quantity,
              p_operation_id: params.operationId,
              p_reason: params.reason ?? null,
            })
          }

          const beforeExit = await balance()
          if (beforeExit !== 10) throw new Error(`EXPECTED_INITIAL_10_GOT_${beforeExit}`)

          const [exit7, exit6] = await Promise.all([
            movement({ type: 'EXIT', quantity: 7, operationId: randomUUID(), reason: 'concurrency A' }),
            movement({ type: 'EXIT', quantity: 6, operationId: randomUUID(), reason: 'concurrency B' }),
          ])

          const exitResults = [exit7, exit6]
          const exitSuccesses = exitResults.filter((r) => !r.error)
          const exitFailures = exitResults.filter((r) => r.error)
          if (exitSuccesses.length !== 1 || exitFailures.length !== 1) {
            throw new Error(`EXPECTED_ONE_EXIT_SUCCESS_ONE_FAILURE got success=${exitSuccesses.length} failure=${exitFailures.length}`)
          }
          if (!exitFailures[0].error.message.includes('STOCK_INSUFFICIENT')) {
            throw new Error(`EXPECTED_STOCK_INSUFFICIENT: ${exitFailures[0].error.message}`)
          }

          const afterExit = await balance()
          if (![3, 4].includes(afterExit)) {
            throw new Error(`CONCURRENCY_NEGATIVE_OR_WRONG_BALANCE_${afterExit}`)
          }

          const { data: exits, error: exitsError } = await supabase
            .from('stock_movements')
            .select('id,type,operation_id')
            .eq('product_id', process.env.PRODUCT_ID)
            .eq('type', 'EXIT')
          if (exitsError) throw new Error(`EXIT_HISTORY_READ_FAILED: ${exitsError.message}`)
          if (exits.length !== 1) throw new Error(`EXPECTED_ONE_EXIT_MOVEMENT_GOT_${exits.length}`)

          const sameOperationId = randomUUID()
          const [entryA, entryB] = await Promise.all([
            movement({ type: 'ENTRY', quantity: 2, operationId: sameOperationId, reason: 'same operation' }),
            movement({ type: 'ENTRY', quantity: 2, operationId: sameOperationId, reason: 'same operation' }),
          ])

          for (const result of [entryA, entryB]) {
            if (result.error) throw new Error(`IDEMPOTENT_CONCURRENCY_FAILED: ${result.error.message}`)
          }
          const replayFlags = [entryA, entryB].map((r) => Boolean(r.data?.[0]?.replayed)).sort()
          if (replayFlags.join(',') !== 'false,true') {
            throw new Error(`EXPECTED_ONE_NEW_ONE_REPLAY_GOT_${replayFlags.join(',')}`)
          }

          const afterIdempotentEntry = await balance()
          if (afterIdempotentEntry !== afterExit + 2) {
            throw new Error(`IDEMPOTENCY_CHANGED_BALANCE_TWICE before=${afterExit} after=${afterIdempotentEntry}`)
          }

          const { data: sameOpRows, error: sameOpError } = await supabase
            .from('stock_movements')
            .select('id,operation_id')
            .eq('operation_id', sameOperationId)
          if (sameOpError) throw new Error(`IDEMPOTENCY_HISTORY_READ_FAILED: ${sameOpError.message}`)
          if (sameOpRows.length !== 1) throw new Error(`EXPECTED_ONE_IDEMPOTENT_MOVEMENT_GOT_${sameOpRows.length}`)

          await supabase.auth.signOut()
          console.log(JSON.stringify({
            status: 'PASS',
            beforeExit,
            afterExit,
            afterIdempotentEntry,
            concurrentExitSuccesses: 1,
            concurrentExitFailures: 1,
            idempotentRows: 1,
            replayFlags,
          }))
          NODE
