name: M3 PRF Manifest

on:
  push:
    branches:
      - feature/m3-inventory-core

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-inventory-core

      - name: Generate SHA-256 manifest
        run: |
          cd artifacts/phases/PHASE-06-M3-ESTOQUE-CORE
          sha256sum \
            PHASE-06-M3-PLAN.md \
            MISSION-TRACE.md \
            PHASE-06-M3-REPORT.md \
            PHASE-06-M3-VALIDATION.txt \
            PHASE-06-M3-VALIDATION-FULL.txt \
            PHASE-06-M3-SMOKE.txt \
            PHASE-06-M3-CHECKPOINT.yaml \
            PHASE-06-M3-DECISIONS.md \
            README.md \
            > PHASE-06-M3-ARTIFACT-MANIFEST.sha256

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- artifacts/phases/PHASE-06-M3-ESTOQUE-CORE/PHASE-06-M3-ARTIFACT-MANIFEST.sha256 && \
             git ls-files --error-unmatch artifacts/phases/PHASE-06-M3-ESTOQUE-CORE/PHASE-06-M3-ARTIFACT-MANIFEST.sha256 >/dev/null 2>&1; then
            echo 'Manifest already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/phases/PHASE-06-M3-ESTOQUE-CORE/PHASE-06-M3-ARTIFACT-MANIFEST.sha256
          git commit -m 'docs(mcf): generate M3 PRF SHA-256 manifest'
          git push origin HEAD:feature/m3-inventory-core
