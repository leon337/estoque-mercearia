name: M7 HTTP Smoke

on:
  push:
    branches: [feature/m7-mvp-qualification]

permissions:
  contents: read

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exwtngpwqgkrkoszpgib.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dXdPZQclAr5u7yskNNmHhw_AhtmW81_
      FIXTURE_EMAIL: m7-http-admin@example.org
      FIXTURE_PASSWORD: M7-Temp-Only-9!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Verify hosted password Auth
        run: |
          CODE=$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$FIXTURE_EMAIL\",\"password\":\"$FIXTURE_PASSWORD\"}")
          python -c 'import json; d=json.load(open("/tmp/auth.json")); assert d.get("access_token"), d'
          test "$CODE" = "200"

      - name: Build and start Next.js
        run: |
          npm run build
          npm start > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/login >/tmp/login.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/next.log
          exit 1

      - name: Login through Next Server Action
        run: |
          ACTION=$(python - <<'PY'
          import re
          html=open('/tmp/login.html',encoding='utf-8').read()
          match=re.search(r'name="(\$ACTION_ID_[^"]+)"',html)
          if not match:
              raise SystemExit('server action field not found')
          print(match.group(1))
          PY
          )
          CODE=$(curl -sS -o /tmp/action-body.html -D /tmp/action-headers.txt -w '%{http_code}' \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Referer: http://127.0.0.1:3000/login' \
            -F "$ACTION=" \
            -F "email=$FIXTURE_EMAIL" \
            -F "password=$FIXTURE_PASSWORD" \
            http://127.0.0.1:3000/login)
          test "$CODE" = "303"
          grep -qi '^location: /' /tmp/action-headers.txt
          CODE=$(curl -sS -o /tmp/after-login.html -w '%{http_code}' \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            http://127.0.0.1:3000/)
          test "$CODE" = "200"
          grep -q 'Estoque Mercearia' /tmp/after-login.html
          ! grep -q '>Entrar<' /tmp/after-login.html

      - name: Verify protected MVP routes with session cookie
        run: |
          check_route() {
            path="$1"
            expected="$2"
            code=$(curl -sS -o /tmp/route.html -w '%{http_code}' -b /tmp/cookies.txt "http://127.0.0.1:3000$path")
            test "$code" = "200"
            grep -q "$expected" /tmp/route.html
          }
          check_route / 'Estoque Mercearia'
          check_route /inventory 'Estoque atual'
          check_route /movements/new 'Nova movimentação'
          check_route /history 'Movimentações de estoque'
          check_route /admin/users 'Usuários e permissões'
          check_route /admin/adjustment 'Ajuste de estoque'
          code=$(curl -sS -o /tmp/products.html -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:3000/products)
          test "$code" = "200"
          grep -q 'M7-HTTP-001' /tmp/products.html

      - name: Logout through Next Server Action
        run: |
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/ > /tmp/home.html
          ACTION=$(python - <<'PY'
          import re
          html=open('/tmp/home.html',encoding='utf-8').read()
          matches=re.findall(r'name="(\$ACTION_ID_[^"]+)"',html)
          if not matches:
              raise SystemExit('logout server action field not found')
          print(matches[-1])
          PY
          )
          CODE=$(curl -sS -o /tmp/logout-body.html -D /tmp/logout-headers.txt -w '%{http_code}' \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Referer: http://127.0.0.1:3000/' \
            -F "$ACTION=" \
            http://127.0.0.1:3000/)
          test "$CODE" = "303"
          grep -qi '^location: /login' /tmp/logout-headers.txt
          CODE=$(curl -sS -L -o /tmp/after-logout.html -w '%{http_code}' \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            http://127.0.0.1:3000/)
          test "$CODE" = "200"
          grep -q '>Entrar<' /tmp/after-logout.html

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo '--- Next log ---'
          cat /tmp/next.log || true
          echo '--- Login action headers ---'
          cat /tmp/action-headers.txt || true
          echo '--- Logout headers ---'
          cat /tmp/logout-headers.txt || true
