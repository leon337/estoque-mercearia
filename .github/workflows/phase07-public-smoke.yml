name: Phase 07 Public Smoke

on:
  push:
    branches: [docs/phase07-public-release-closeout]

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Login page is public
        run: |
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/login.html -w '%{http_code}' https://estoque-mercearia.onrender.com/login)
          test "$code" = "200"
          grep -q 'Estoque Mercearia' /tmp/login.html
          grep -q '>Entrar<' /tmp/login.html
      - name: Registration page is public
        run: |
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -D /tmp/register.headers -o /tmp/register.html -w '%{http_code}' https://estoque-mercearia.onrender.com/register)
          echo "register status=$code bytes=$(wc -c < /tmp/register.html)"
          test "$code" = "200"
          if ! grep -q 'Solicitar acesso' /tmp/register.html; then
            echo 'expected marker missing; safe response excerpt follows'
            grep -Eo 'Estoque Mercearia|Entrar|Solicitar acesso|Enviar pedido de acesso|Application error|Internal Server Error|This page could not be found' /tmp/register.html | head -20 || true
            head -c 1200 /tmp/register.html | sed -E 's/(value|token|key|password)="[^"]*"/\1="[redacted]"/g'
            exit 1
          fi
      - name: Protected routes redirect to login
        run: |
          for path in / /inventory /products /movements/new /history /admin/users /admin/adjustment; do
            curl -sS --retry 5 --retry-all-errors --retry-delay 3 -D /tmp/headers -o /dev/null "https://estoque-mercearia.onrender.com$path"
            code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c}' /tmp/headers)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r", "", $2); print $2}' /tmp/headers | tail -1)
            test "$code" = "307" -o "$code" = "308" -o "$code" = "302" -o "$code" = "303"
            case "$location" in
              /login*|https://estoque-mercearia.onrender.com/login*) ;;
              *) echo "unexpected redirect for $path: $code $location"; cat /tmp/headers; exit 1 ;;
            esac
          done
      - name: Public endpoint remains healthy after requests
        run: |
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/final.html -w '%{http_code}' https://estoque-mercearia.onrender.com/login)
          test "$code" = "200"
