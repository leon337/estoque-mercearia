name: M6 PRF Manifest
on:
  push:
    branches: [feature/m6-admin-hardening]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/m6-admin-hardening }
      - name: Generate SHA-256 manifest
        run: |
          cd artifacts/phases/PHASE-06-M6-ADMIN-HARDENING
          sha256sum PHASE-06-M6-PLAN.md MISSION-TRACE.md PHASE-06-M6-REPORT.md PHASE-06-M6-VALIDATION.txt PHASE-06-M6-VALIDATION-FULL.txt PHASE-06-M6-SMOKE.txt PHASE-06-M6-CHECKPOINT.yaml PHASE-06-M6-DECISIONS.md README.md > PHASE-06-M6-ARTIFACT-MANIFEST.sha256
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phases/PHASE-06-M6-ADMIN-HARDENING/PHASE-06-M6-ARTIFACT-MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m "docs(mcf): generate M6 PRF manifest"
          git push origin HEAD:feature/m6-admin-hardening