name: M1 Auth Smoke

on:
  push:
    branches:
      - feature/m1-auth-base

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://exwtngpwqgkrkoszpgib.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_dXdPZQclAr5u7yskNNmHhw_AhtmW81_
    steps:
      - name: Define temporary credentials
        run: |
          echo "SMOKE_EMAIL=m1-smoke-${GITHUB_RUN_ID}@gmail.com" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=M1-Smoke-${GITHUB_RUN_ID}!Aa9" >> "$GITHUB_ENV"

      - name: Create temporary operator
        run: |
          RESPONSE=$(curl -sS \
            -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\",\"data\":{\"name\":\"M1 Smoke Operator\"}}")
          echo "Signup attempted for $SMOKE_EMAIL"
          ERROR=$(jq -r '.error_description // .msg // .message // empty' <<< "$RESPONSE")
          if [ -n "$ERROR" ] && [[ "$ERROR" != *"already"* ]]; then
            echo "SIGNUP_ERROR=$ERROR"
            exit 41
          fi

      - name: Sign in with password
        run: |
          RESPONSE=$(curl -sS \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}")
          TOKEN=$(jq -r '.access_token // empty' <<< "$RESPONSE")
          USER_ID=$(jq -r '.user.id // empty' <<< "$RESPONSE")
          if [ -z "$TOKEN" ] || [ -z "$USER_ID" ]; then
            ERROR=$(jq -r '.error_description // .msg // .message // .error // "login failed"' <<< "$RESPONSE")
            echo "LOGIN_ERROR=$ERROR"
            echo "SMOKE_EMAIL=$SMOKE_EMAIL"
            exit 42
          fi
          echo "ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SMOKE_USER_ID=$USER_ID" >> "$GITHUB_ENV"
          echo "Password login succeeded for user $USER_ID"

      - name: Verify profile through RLS
        run: |
          RESPONSE=$(curl -sS \
            "$SUPABASE_URL/rest/v1/profiles?select=id,name,role,active&id=eq.$SMOKE_USER_ID" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          COUNT=$(jq 'length' <<< "$RESPONSE")
          ROLE=$(jq -r '.[0].role // empty' <<< "$RESPONSE")
          ACTIVE=$(jq -r '.[0].active // empty' <<< "$RESPONSE")
          ID=$(jq -r '.[0].id // empty' <<< "$RESPONSE")
          if [ "$COUNT" -ne 1 ] || [ "$ROLE" != "OPERATOR" ] || [ "$ACTIVE" != "true" ] || [ "$ID" != "$SMOKE_USER_ID" ]; then
            echo "RLS_PROFILE_CHECK_FAILED"
            echo "$RESPONSE"
            exit 43
          fi
          echo "RLS profile check passed: OPERATOR sees own active profile"

      - name: Sign out
        run: |
          curl -sS -o /dev/null -w "logout_http=%{http_code}\n" \
            -X POST "$SUPABASE_URL/auth/v1/logout" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN"
